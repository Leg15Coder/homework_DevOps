stages:
  - build
  - deploy
  - test

# Этап 1: Сборка и публикация образа
build_image:
  stage: build
  image: docker:24.0
  services:
    - docker:24.0-dind
  variables:
    DOCKER_DRIVER: overlay2
  script:
    - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN registry.gitlab.com
    - docker build -t registry.gitlab.com/$CI_PROJECT_PATH:$CI_COMMIT_SHORT_SHA .
    - docker push registry.gitlab.com/$CI_PROJECT_PATH:$CI_COMMIT_SHORT_SHA
  only:
    - main

# Этап 2: Деплой в тестовое окружение (Docker Compose)
deploy_staging:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - echo "Host * StrictHostKeyChecking no" > ~/.ssh/config
  script:
    - ssh $TARGET_USER@$TARGET_HOST <
