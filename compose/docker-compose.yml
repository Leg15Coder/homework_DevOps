version: '3.8'

services:
  app:
    image: nginx:alpine
    container_name: backend_app
    volumes:
      - ./html:/usr/share/nginx/html:ro
    networks:
      - app_net

  nginx:
    image: nginx:alpine
    container_name: reverse_proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - app_net

networks:
  app_net:
    driver: bridge
